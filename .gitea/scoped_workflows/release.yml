name: Release

# Scoped workflow (ADR-0017): it is started by hand in any repository of an
# organization with the version to release and a dry_run flag. It creates the
# version tag, the release page from the changelog entry and, from 1.0.0, moves
# the major tag, and only when the commit is the tip of the default branch, its
# run "Validate / validate (push)" is green and the changelog has an entry for
# the version. dry_run defaults to true: it checks and prints and writes
# nothing, so a release is a deliberate second run with dry_run false.
# It requires the organization secret TOKEN_FOR_GITEA_RELEASE and has no
# fallback to the token of the run or to any other secret. The script is a file
# of TirSystem/git-workflows (tools/release.py), fetched at v2.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, MAJOR.MINOR.PATCH without a leading v"
        required: true
      dry_run:
        description: "true checks only; false creates the tag, the release page and the major tag"
        required: false
        default: "true"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Fetch the shared script
        uses: actions/checkout@v4.2.2
        with:
          repository: TirSystem/git-workflows
          ref: v2
          path: shared-scripts

      - name: Check and publish the release
        env:
          GITEA_API_URL: ${{ gitea.api_url }}
          SOURCE_REPOSITORY: ${{ gitea.repository }}
          RELEASE_CREDENTIALS: ${{ secrets.TOKEN_FOR_GITEA_RELEASE }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_SHA: ${{ gitea.sha }}
        run: python3 shared-scripts/tools/release.py
