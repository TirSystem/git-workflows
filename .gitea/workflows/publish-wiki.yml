name: Publish wiki

on:
  push:
    branches: [ main ]
    paths:
      - "wiki/**"
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish-wiki:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check that the English pages are current
        run: python3 tools/build_wiki.py --check

      - name: Publish the pages to the wiki
        env:
          GITEA_API_URL: ${{ gitea.api_url }}
          SOURCE_REPOSITORY: ${{ gitea.repository }}
          # TOKEN_FOR_GITEA_WIKI wins when it exists; otherwise TOKEN_FOR_GITEA is reused.
          WIKI_CREDENTIALS: ${{ secrets.TOKEN_FOR_GITEA_WIKI || secrets.TOKEN_FOR_GITEA }}
        run: python3 tools/publish_wiki.py
