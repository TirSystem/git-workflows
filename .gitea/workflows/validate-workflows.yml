name: Validate workflows

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2

      - name: Create a virtual environment and install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet -r tests/requirements.txt

      - name: Validate workflow files and run the offline tests under coverage
        run: .venv/bin/python -m coverage run -m pytest -q tests

      - name: Check the coverage of the tools
        run: .venv/bin/python -m coverage report

      - name: Lint the shell scripts of the actions
        env:
          SHELLCHECK: .venv/bin/shellcheck
          SHFMT: .venv/bin/shfmt
        run: bash tools/lint-action-scripts.sh actions

  english-comments:
    # This repository's own call of the reusable English comments workflow
    # (MIL-013, ADR-0012). The check to mark as required in the branch
    # protection of `main` (MIL-013 task 9, done by the repository owner).
    if: ${{ gitea.event_name == 'pull_request' }}
    uses: TirSystem/git-workflows/.gitea/workflows/english-comments.yml@v3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      # The corpus holds comments in other languages on purpose (ADR-0012).
      exclude: "tests/fixtures/**"
